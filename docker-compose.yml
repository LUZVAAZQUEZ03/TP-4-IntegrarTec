services:
  postgres:
    image: postgres:16-alpine
    container_name: planify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planify_password}
      POSTGRES_DB: ${POSTGRES_DB:-planify_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
