services:
  postgres:
    image: postgres:16-alpine
    container_name: agenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenda_password}
      POSTGRES_DB: ${POSTGRES_DB:-agenda_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
